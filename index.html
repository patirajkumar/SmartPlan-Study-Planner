<!DOCTYPE html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> SmartPlan: Effortless Planning </title>
    
    <!-- Calender -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@3.9.0/dist/fullcalendar.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@3.9.0/dist/fullcalendar.min.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="index.css" />

    <script src="index.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>📘 SmartPlan: Effortless Planning</h1>
        
        <!-- Form -->
        <form id="taskform">
            <input type="text" id="taskname" placeholder="Task Name" required />
            <input type="text" id="subject" placeholder="Subject" required />
            <input type="date" id="date" required />
            <input type="number" id="priority" placeholder="Priority ( 1 - 5 )" min="1" max="5" required />
            <select id="category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Homework"> 📚 Homework </option>
                <option value="Project"> 🛠️ Project </option>
                <option value="Revision"> 🔁 Revision </option>
                <option value="Exam Prep"> 📝 Exam Prep </option>
            </select>
            <button type="submit"> Add Task </button>
        </form>

        <!-- List of Task -->
        <h2> Your Tasks </h2>
        <ul id="tasklist"></ul>

        <!-- Progress -->
        <h3>📈 Progress</h3>
        <p>Completed: <span id="completeno">0</span> / <span id="totalno">0</span></p>
        <canvas id="chart" width="400" height="300"></canvas>

        <!-- Calendar -->
        <h3>🗓️ Study Calendar</h3>
        <div id="calendar"></div>
    </div>
</body>
</html>
